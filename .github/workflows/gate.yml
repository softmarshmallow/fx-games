name: gate

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/fx: uv sync installs grida from it
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run python scripts/check.py

  optional-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [games, docs]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/fx: uv sync installs grida from it
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-groups --frozen
      - run: uv run --all-groups python scripts/check.py --scope ${{ matrix.scope }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/fx: uv sync installs grida from it
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: uv sync --frozen
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: uv run python scripts/check.py --scope web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/fx: uv sync installs grida from it
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: uv run --all-groups ruff format --check .
      - run: uv run --all-groups ruff check .
      - name: Typecheck product and optional consumers
        run: >-
          uv run --all-groups mypy --strict src tests scripts
          godot/packages/scenario_runtime/authoring/src
          godot/games/_shared/python/src
          godot/games/bellweather/pipeline/src
          godot/games/iron_petal_unit/pipeline/src
          godot/games/ember_hollow/pipeline/src
          godot/games/the_grain/pipeline/src
          godot/tools/python/src
          godot/games/bellweather/tools/author_terrain.py
          godot/games/bellweather/tools/design_map.py
          godot/games/bellweather/tools/prove_climbable_bands.py
          godot/games/bellweather/tools/render_asset_scale_figures.py
          godot/tools/parity_diff.py
          godot/tools/render_terrain_atlas_qa.py
          godot/tools/validate_game_package.py
          godot/tools/write_game_contract_identities.py
          godot/tools/write_game_graph_contract.py
          godot/templates/asset_consumer/prepare.py
      - name: Typecheck gnode game projects
        run: |
          uv run --all-groups mypy --strict godot/games/iron_petal_unit/pipeline/workflow.py godot/games/iron_petal_unit/pipeline/nodes
          uv run --all-groups mypy --strict godot/games/bellweather/pipeline/workflow.py godot/games/bellweather/pipeline/nodes
          uv run --all-groups mypy --strict godot/games/the_grain/pipeline/workflow.py godot/games/the_grain/pipeline/nodes
          uv run --all-groups mypy --strict godot/games/ember_hollow/pipeline/workflow.py godot/games/ember_hollow/pipeline/nodes

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/fx: uv sync installs grida from it
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - name: Install Godot
        env:
          GODOT_VERSION: 4.7.2
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}"
          unzip -q "$archive"
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "GODOT=$HOME/.local/bin/godot" >> "$GITHUB_ENV"
      - run: uv run --all-groups python scripts/check.py --scope godot
