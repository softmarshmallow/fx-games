[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stage-gen"
version = "0.0.0"
description = "Headless, reproducible 2D game-asset generation pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "stage-gen contributors" }]
dependencies = [
  "jsonschema>=4.26,<5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.13,<5",
  "pyyaml>=6.0.2,<7",
  # Grida FX, the engine stage-gen runs on, from the submodule at third_party/fx.
  "grida",
]

[dependency-groups]
dev = [
  "types-jsonschema>=4.26,<5",
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]
games = ["demo-game-collection"]

[tool.uv.workspace]
members = [
  "godot/packages/scenario_runtime/authoring",
  "godot/games/_shared/python",
  "godot/games/bellweather/pipeline",
  "godot/games/iron_petal_unit/pipeline",
  "godot/games/ember_hollow/pipeline",
  "godot/games/the_grain/pipeline",
  "godot/tools/python",
]

[tool.uv.sources]
demo-game-collection = { workspace = true }
grida = { path = "third_party/fx/python", editable = true }

[tool.hatch.build]
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hooks.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stage_gen"]
# A target's exclude replaces the build-wide list, so the wheel repeats it. Workflow prose
# (page.mdx, contract.md) is read from the checkout by the site, never by installed code, and
# a takes file holds someone's personal picks.
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
  "/src/stage_gen/workflows/**/*.mdx",
  "/src/stage_gen/workflows/**/contract.md",
  "/src/stage_gen/workflows/**/*.takes.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/LICENSE",
  "/README.md",
  "/VERIFICATION.md",
  "/pyproject.toml",
  "/docs/**/*.json",
  "/docs/**/*.md",
  "/scripts/**/*.py",
  "/src/stage_gen/**",
  "/tests/**/*.json",
  "/tests/**/*.py",
]
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
  "/.env",
  "/.git/**",
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/build/**",
  "/dist/**",
  "/example-output/**",
  "/fixtures/**",
  "/node_modules/**",
  "/web/**",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.tsbuildinfo",
  "**/qa-screenshots/**",
  "**/screenshots/**",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# third_party/fx is gridaco/fx: its own rules and gates check it (third_party/fx/AGENTS.md).
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["stage_gen", "scenario_authoring", "demo_game_tools", "demo_game_collection", "bellweather_pipeline", "iron_petal_unit_pipeline", "ember_hollow_pipeline", "the_grain_pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
