# Iron Petal Unit's asset build. The builder (pipeline/workflow.py) reads the game's own
# package with the game's reader and writes one step per asset; the node modules under
# pipeline/nodes/ import the game's pipeline package, the shared game tools and FX Games,
# so those count as their source: fx.lock notices when they change under a version.
fx: project/v1
runs: ../../../out/runs
cache: ../../../out/fx-cache
nodes: pipeline/nodes
sources: [iron_petal_unit_pipeline, demo_game_tools, fx_games]
routes:
  # Cut-out art needs native alpha and seam repaints need a mask: the direct route has both.
  image.generate: gpt-image-2.5-sunburst@openai
  image.edit: gpt-image-2.5-sunburst@openai
  structured.generate: openai/gpt-5.6-sol@openrouter
  agent.turn: openai/gpt-5.6-sol@openrouter
  music.generate: google/lyria-3-pro-preview@openrouter
  sound.generate: eleven_text_to_sound_v2@elevenlabs
  speech.generate: eleven_v3@elevenlabs
