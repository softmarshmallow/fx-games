  "map-crowncrag-road-layer-open_sky-validate",
  "map-crowncrag-road-layer-amberbell_horizon-validate",
  "map-crowncrag-road-layer-amberbell_route-validate",
  "map-crowncrag-road-layer-autumn_foliage_frame-validate",
