# The examples Bellweather made: outputs that need the whole game package, published through
# the product's example contract by `demo-games example export bellweather`. Prose lives in
# examples/<id>/page.mdx; the importers live in bellweather_pipeline.examples. Each example is
# a frozen export in the local store (out/examples/bellweather/<id>/), pinned here by digest.
schema_version = 1
kind = "game-examples-v1"
game = "bellweather"
title = "Bellweather"

[[examples]]
id = "parallax-backgrounds"
title = "Seamless parallax backgrounds"
promise = "One reference picture per map in. Depth layers that scroll forever without a seam out."
status = "approved"
order = 1
related = ["looping-parallax"]
command = "uv run python -m grida.fx run pipeline/workflow.py:build --arg package=inputs/my-game --arg part=world --live --max-usd 30"
footer = "Every layer on this page is the one Bellweather's latest world run published, traced back to the run that drew it."
importer = "parallax_layers"
example_sha256 = "1df01cdf2277140fd5114c5cb8be57d388e4429136efc047a0f1d84bd67af722"
figures_sha256 = "262c94ecc231c809813dc590ea8290bd2f484a492d0c3311dea3867da3dcfdac"

[examples.run]
runs = [
  "out/bellweather-m18-world",
  "out/bellweather-m18-world-review",
  "out/bellweather-m19-world",
  "out/bellweather-m19-world-review",
  "out/bellweather-m20-world",
  "out/bellweather-m21-world",
  "out/bellweather-m21-world-review",
]
package = "godot/games/bellweather/inputs/default"
maps = ["sunpetal-crossing", "crowncrag-road"]
walker = "out/bellweather-m21"

[[examples.tools]]
name = "Pillow and NumPy"
role = "Find the path where each repaint agrees with the drawing, cut it in, and trim and place every layer"

[examples.labels]
"map-sunpetal-crossing-layer-clear_sky-generate" = "Draw the village sky"
"map-sunpetal-crossing-layer-clear_sky-loop" = "Loop the village sky"
"map-sunpetal-crossing-layer-clear_sky-validate" = "Trim and place the village sky"
"map-sunpetal-crossing-layer-clouds_and_far_valley-generate" = "Draw the clouds and far valley"
"map-sunpetal-crossing-layer-clouds_and_far_valley-loop" = "Loop the clouds and far valley"
"map-sunpetal-crossing-layer-clouds_and_far_valley-validate" = "Trim and place the clouds and far valley"
"map-sunpetal-crossing-layer-sunpetal_village-generate" = "Draw the village"
"map-sunpetal-crossing-layer-sunpetal_village-loop" = "Loop the village"
"map-sunpetal-crossing-layer-sunpetal_village-validate" = "Trim and place the village"
