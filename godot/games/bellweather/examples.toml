[[examples.steps]]
label = "Sunpetal Crossing"
note = "Four layers, far to near, each drawn from the map's reference picture. Each one is tested as it came back; one that does not loop has its wrap repainted and cut back in. Then it is trimmed to its content and placed by its anchor. Last, a board of every layer and the ground is judged by a model that drew none of it; its verdict is advice, and does not stop the run."
members = [
  "map-sunpetal-crossing-layer-clear_sky-generate",
  "map-sunpetal-crossing-layer-clouds_and_far_valley-generate",
  "map-sunpetal-crossing-layer-sunpetal_village-generate",
  "map-sunpetal-crossing-layer-near_garden_frame-generate",
  "map-sunpetal-crossing-layer-clear_sky-loop",
  "map-sunpetal-crossing-layer-clouds_and_far_valley-loop",
  "map-sunpetal-crossing-layer-sunpetal_village-loop",
  "map-sunpetal-crossing-layer-near_garden_frame-loop",
  "map-sunpetal-crossing-layer-clear_sky-validate",
  "map-sunpetal-crossing-layer-clouds_and_far_valley-validate",
  "map-sunpetal-crossing-layer-sunpetal_village-validate",
  "map-sunpetal-crossing-layer-near_garden_frame-validate",
  "map-sunpetal-crossing-composite",
  "map-sunpetal-crossing-review",
]

[[examples.steps]]
label = "Amberbell Forest"
note = "The same steps for the forest's four layers, its board and its review."
members = [
  "map-crowncrag-road-layer-open_sky-generate",
  "map-crowncrag-road-layer-amberbell_horizon-generate",
  "map-crowncrag-road-layer-amberbell_route-generate",
  "map-crowncrag-road-layer-autumn_foliage_frame-generate",
  "map-crowncrag-road-layer-open_sky-loop",
  "map-crowncrag-road-layer-amberbell_horizon-loop",
  "map-crowncrag-road-layer-amberbell_route-loop",
