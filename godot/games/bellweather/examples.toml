]

[[examples.steps]]
label = "Climbing, acting and reacting"
note = "The climbs are two frames each, seen from behind and hanging from the hands; the game steps them by how far she climbs. Attack, cast, hurt and death are four poses each, played once."
members = [
  "player-wayfarer-state-climb_ladder-generate",
