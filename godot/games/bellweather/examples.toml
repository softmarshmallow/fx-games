members = [
  "player-wayfarer-dialogue-generate",
  "player-wayfarer-dialogue-validate",
]

[[examples.steps]]
label = "One size"
note = "Every call draws at its own scale. A vision model compares all the strips with idle on one plate and sets a size for each; a second pass judges the plate with those sizes applied and corrects what is left."
members = [
  "player-wayfarer-motion-rebase",
  "player-wayfarer-motion-rebase-verify",
]

[[examples.steps]]
label = "Review"
note = "A contact sheet of the whole set, judged by a model that drew none of it. The verdict is advice for the author; it does not stop the run."
