[[examples]]
id = "terrain-tiles"
title = "47-tile terrain"
promise = "One scene picture in. A ground tile set that fits any shape of level out."
status = "approved"
order = 2
command = "uv run python -m grida.fx run pipeline/workflow.py:build --arg package=inputs/my-game --arg part=world --live --max-usd 30"
footer = "Both atlases were made in Bellweather's world preparation, a larger graph that also paints each map's backgrounds; this page shows the part that makes the ground. The template is adapted from the terrain example in the Godot documentation, CC BY 3.0."
importer = "terrain_atlas"
example_sha256 = "2adce85b63f82d64fc47e7aebf7ab68e5f8afff472c3bc3dec8cb7b44a18d129"
figures_sha256 = "3b7d1296fcd7d58938fc3f46fb52aac07983569e676fd1c33259b6dde057d707"

[examples.run]
runs = [
  "out/bellweather-m4-world-v3",
  "out/bellweather-m15-world",
  "out/bellweather-m17-world",
]
package = "godot/games/bellweather/inputs/default"
maps = [{ map = "sunpetal-crossing", name = "village" }, { map = "crowncrag-road", name = "forest" }]

[[examples.tools]]
name = "Pillow"
role = "Cuts the sheet on fixed lines, measures every join and packs the atlas"

[examples.labels]
"map-sunpetal-crossing-terrain-generate" = "Lay out the village level"
"map-sunpetal-crossing-ground-generate" = "Paint the village tiles"
"map-sunpetal-crossing-ground-validate" = "Cut and check the village atlas"
"map-crowncrag-road-terrain-generate" = "Lay out the forest level"
"map-crowncrag-road-ground-generate" = "Paint the forest tiles"
"map-crowncrag-road-ground-validate" = "Cut and check the forest atlas"

[[examples.steps]]
label = "Lay out the level"
note = "A language model answers each map's terrain request with a grid of solid and empty cells. The atlas does not depend on it; the level preview does."
members = [
  "map-sunpetal-crossing-terrain-generate",
  "map-crowncrag-road-terrain-generate",
]

[[examples.steps]]
label = "Paint over the template"
note = "One image call per map. The model is given the template's 48 cells behind a thin cyan fence, and the map's scene for its look. It repaints the art and keeps the structure. A sheet that fails the checks is drawn again, up to six tries."
members = [
  "map-sunpetal-crossing-ground-generate",
  "map-crowncrag-road-ground-generate",
]

[[examples.steps]]
label = "Cut and check"
note = "Local and free. The sheet is cut on fixed lines into 120-pixel tiles, checked for holes and packed into the atlas, then laid out as the level to preview it."
members = [
  "map-sunpetal-crossing-ground-validate",
  "map-crowncrag-road-ground-validate",
]

