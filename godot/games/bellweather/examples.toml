[[examples.steps]]
label = "Concept"
note = "The character is drawn once, in side view and three-quarter view, from the game's cover and a short brief. Every later drawing is held to this picture."
members = [
  "player-wayfarer-concept-generate",
]

[[examples.steps]]
label = "Moving"
note = "Each animation is its own image call from the concept: four poses in one row. The gate cuts every pose out whole and stands it on one line."
members = [
  "player-wayfarer-state-idle-generate",
  "player-wayfarer-state-idle-validate",
  "player-wayfarer-state-walk-generate",
