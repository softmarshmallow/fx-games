# Ember Hollow's asset build. The builder (pipeline/workflow.py) reads the game's own
# package with the game's reader and writes one step per asset; the node modules under
# pipeline/nodes/ import the game's pipeline package, the shared game tools and Stage Gen,
# so those count as their source: fx.lock notices when they change under a version.
# The opening's clips publish through an ffmpeg built with libtheora, declared as the
# `ffmpeg-theora` tool: set GRIDA_FX_TOOL_FFMPEG_THEORA to it (Homebrew's ffmpeg@7 has it).
fx: project/v1
runs: ../../../out/runs
cache: ../../../out/fx-cache
nodes: pipeline/nodes
sources: [ember_hollow_pipeline, demo_game_tools, stage_gen]
routes:
  # Cut-out art needs native alpha: the direct route has it.
  image.generate: gpt-image-2.5-sunburst@openai
  image.edit: gpt-image-2.5-sunburst@openai
  structured.generate: openai/gpt-5.6-sol@openrouter
  agent.turn: openai/gpt-5.6-sol@openrouter
  music.generate: google/lyria-3-pro-preview@openrouter
  sound.generate: eleven_text_to_sound_v2@elevenlabs
  video.generate: google/gemini-omni-flash/v1.1/image-to-video@fal
