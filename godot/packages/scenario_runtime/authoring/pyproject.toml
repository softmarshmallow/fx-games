[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scenario-authoring"
version = "0.0.0"
description = "Standalone authoring tools for the Godot Scenario runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
scenario-authoring = "scenario_authoring.cli:main"

[dependency-groups]
dev = ["build>=1.2,<2", "hatchling>=1.27,<2", "pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/scenario_authoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
