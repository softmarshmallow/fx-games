# Only what the workflow file cannot say. Steps, titles and the sample plan come from
# workflow.yaml through FX.
schema_version = 1
kind = "stage-gen-workflow-v1"
id = "looping-parallax"
title = "Looping parallax"
promise = "Layer pictures in. Repeating layers and their scroll placement out."
summary = """
Each supplied layer is made to repeat on its own, by mirroring its edges or by repainting the \
seam, then the layers are composed with their offsets and scroll factors into a portable \
manifest and a preview frame."""

[try]
input = "Two original layers and the inputs.yaml that places them, written by uv run python src/stage_gen/workflows/looping_parallax/inputs/supplied_layers/make_inputs.py out/looping-parallax-input"
commands = [
  "uv run python -m grida.fx plan looping-parallax --inputs out/looping-parallax-input/inputs.yaml",
  "uv run python -m grida.fx run looping-parallax --inputs out/looping-parallax-input/inputs.yaml --deliver manifest=out/looping-parallax-try/manifest.json --deliver preview=out/looping-parallax-try/preview.png --deliver layers=out/looping-parallax-try/layers/{key}.png",
  "uv run python -m grida.fx inspect looping-parallax --verify",
]

[[outputs]]
artifact_ref = "outputs/manifest.json"
description = "Every layer with its size, order, offsets, repeat axes and scroll factor"

[[outputs]]
artifact_ref = "outputs/preview.png"
description = "One composed frame, for inspection"

[[outputs]]
artifact_ref = "outputs/layers/"
description = "Each layer's repeat unit, by layer id"
