# The portrait-motion workflow's home. Its node modules import FX Games' portrait-motion
# component, so that counts as its source: fx.lock notices when it changes.
fx: project/v1
runs: ../../../../out/runs
cache: ../../../../out/fx-cache
sources: [fx_games]
routes:
  structured.generate: openai/gpt-6-astra@openrouter
  image.edit: gpt-image-2.5-sunburst@openai
