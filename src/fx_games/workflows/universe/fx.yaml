# The universe workflow's home. Its node modules import FX Games' universe models and
# medium contracts, so those count as its source: fx.lock notices when they change.
fx: project/v1
runs: ../../../../out/runs
cache: ../../../../out/fx-cache
sources: [fx_games]
routes:
  structured.generate: openai/gpt-5.6-sol@openrouter
  image.generate: openai/gpt-image-2.5-sunburst@openrouter
